<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='../static/css/style.css') }}">
    <script defer src="{{ url_for('static', path='../static/js/main.js') }}"></script>
    <!-- <script defer src="{{ url_for('static', path='../static/js/script.js') }}"></script> -->
    <title>Todo List</title>
</head>
<body>
    <main class="todo-list">
        <nav class="todo-nav">
            <h1>Todo List</h1>
            <button id="add-task">+</button>
        </nav>
        <article id="todo-main"></article>

        <template id="todo-template">
            <div class="task">
                <div class="task-left">
                    <input type="checkbox">
                    <textarea class="task-field" placeholder="Add a new task..."></textarea>
                </div>
                <button class="delete-task-btn">x</button>
            </div>
        </template>
    </main>
</body>
</html>

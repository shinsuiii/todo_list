<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../static/css/style.css"> -->
    <!-- <script defer src="../static/js/script.js"></script> -->
    <link rel="stylesheet" href="{{ url_for('static', path='../static/css/style.css') }}">
    <script defer src="{{ url_for('static', path='../static/js/script.js') }}"></script>
    <title>Todo List</title>
</head>
<body>
    <main class="todo-list">
        <nav class="todo-nav">
            <h1>Todo List</h1>
        </nav>
        <article class="todo-main">
            <div class="task-template" id="original-task">
                <form class="task-left">
                    <input type="checkbox">
                    <textarea class="task-field" placeholder="Add a new task..."></textarea>
                </form>
                <button class="delete-task-btn">x</button>
            </div>
        </article>
    </main>
</body>
</html>
